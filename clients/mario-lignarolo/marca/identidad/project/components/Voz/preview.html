<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Voz</title>
<style>
  html, body { margin: 0; }
  body { background: var(--fondo); }
  .vz-a { padding: var(--space-9) var(--margen); row-gap: var(--space-5); }
  .vz-a .voz { grid-column: 4 / span 8; max-width: 15em; text-wrap: balance; }
  .vz-b { display: grid; place-items: center; padding: var(--space-10) var(--margen); text-align: center; }
  .vz-b p { max-width: 17em; text-wrap: balance; }
</style>
</head>
<body>
<div class="ml" data-theme="claro">
  <section class="ml ml-reticula vz-a" data-theme="claro">
    <p class="seccion ml-seccion ml-indice">Emprendimiento</p>
    <h2 class="voz">Hay ideas que me gusta pensar. Otras necesito construirlas.</h2>
  </section>
  <section class="ml vz-b" data-theme="oscuro">
    <p class="voz" style="font-style:italic">¿En quién necesitas convertirte para vivir de una manera diferente?</p>
  </section>
</div>
</body>
</html>
