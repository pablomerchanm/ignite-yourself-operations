<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fotografía</title>
<style>
  html, body { margin: 0; }
  body { background: var(--fondo); }
  .ft { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: var(--medianil); padding: var(--space-8) var(--margen); }
  .ft figure { margin: 0; display: grid; gap: var(--space-3); }
  .ft img { width: 100%; height: 100%; object-fit: cover; }
  .ft .f { overflow: hidden; background: var(--fondo-alto); }
  .a { grid-column: 1 / span 7; } .a .f { height: 520px; }
  .b { grid-column: 8 / -1; } .b .f { height: 520px; }
  .c { grid-column: 1 / span 4; } .c .f { aspect-ratio: 4 / 5; }
  .d { grid-column: 5 / span 4; } .d .f { aspect-ratio: 4 / 5; }
  .e { grid-column: 9 / -1; } .e .f { aspect-ratio: 4 / 5; }
</style>
</head>
<body>
<div class="ml ft" data-theme="oscuro">
  <figure class="a"><div class="f"><img src="/_blob/eb9a1528de5dcf59cdf2031b638e8ec3" alt=""></div><figcaption class="label ml-dato">Calle · luz de tarde, en movimiento</figcaption></figure>
  <figure class="b"><div class="f"><img src="/_blob/eb55c99b5b3e21499ba1e92110416bad" alt=""></div><figcaption class="label ml-dato">Entreno · penumbra, de espaldas</figcaption></figure>
  <figure class="c"><div class="f"><img src="/_blob/a112d2e6dc7f27a7f5e6d1dfbee7c714" alt=""></div><figcaption class="label ml-dato">El cuerpo como prueba</figcaption></figure>
  <figure class="d"><div class="f"><img src="/_blob/d0bdf470d48c1c0ec2722ce358a93c4b" alt=""></div><figcaption class="label ml-dato">Psicocibernética · doble exposición</figcaption></figure>
  <figure class="e"><div class="f"><img src="/_blob/a89e873a0e961ee59927f22e92ad2455" alt="" style="object-position:72% 60%"></div><figcaption class="label ml-dato">Lignarolo · campaña, estudio</figcaption></figure>
</div>
</body>
</html>
